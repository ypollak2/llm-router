name: Standalone binary

# Task 35. Removes Python as a prerequisite, which is what unblocks Cursor
# users, Claude Desktop users, and the npm channel (task 37) — none of whom
# reliably have a 3.11+ toolchain and none of whom will acquire one to save
# money on tokens.
#
# Builds on tag, and on demand. NOT on every push: the build is ~40 s of
# PyInstaller work per platform over a ~565 MB dependency tree, and nothing
# downstream consumes an untagged artifact.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      upload:
        description: "Attach artifacts to the run"
        type: boolean
        default: true

# Least privilege at the workflow level; the one job that needs to write
# escalates for itself below.
permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    # Creating a release and uploading assets both require contents: write.
    # The workflow-level `contents: read` made `gh release create` and
    # `gh release upload` fail on every tag build — after every binary had been
    # built, at the last step. Neither v13.1.0 nor v13.1.1 could attach a thing.
    permissions:
      contents: write
    strategy:
      fail-fast: false        # one platform failing must not hide the others
      matrix:
        include:
          - os: macos-14      # arm64
            asset: llm-router-macos-arm64
          - os: ubuntu-latest
            asset: llm-router-linux-x86_64
          - os: windows-latest
            asset: llm-router-windows-x86_64

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          # Match the floor in pyproject. Building on a newer interpreter than
          # the floor would produce a binary that silently requires newer
          # bytecode semantics than the project claims to support.
          python-version: "3.11"

      - name: Install project and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller

      - name: Build
        run: pyinstaller --noconfirm --clean packaging/llm-router.spec

      # A binary that builds and cannot run is worse than no binary: it ships,
      # and the failure surfaces on a user's machine. These are the exact checks
      # that caught litellm being absent from the first local build — it ran
      # fine until something needed the pricing data.
      - name: Smoke test (POSIX)
        if: runner.os != 'Windows'
        run: |
          BIN=dist/llm-router/llm-router
          "$BIN" --version
          "$BIN" --help > /dev/null
          test -f dist/llm-router/_internal/litellm/model_prices_and_context_window_backup.json \
            || { echo "litellm data file missing — pricing will fail at runtime"; exit 1; }
          test "$(ls dist/llm-router/_internal/llm_router/hooks/*.py | wc -l)" -gt 10 \
            || { echo "hook scripts missing — run-hook cannot work"; exit 1; }
          echo '{}' | "$BIN" run-hook dist/llm-router/_internal/llm_router/hooks/usage-refresh.py

      - name: Smoke test (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $bin = "dist\llm-router\llm-router.exe"
          & $bin --version
          & $bin --help > $null
          if (-not (Test-Path "dist\llm-router\_internal\litellm\model_prices_and_context_window_backup.json")) {
            throw "litellm data file missing — pricing will fail at runtime"
          }

      # ── macOS signing and notarisation (task 36) ────────────────────────
      #
      # An unsigned binary triggers Gatekeeper on first run of a tool that asks
      # for shell access. Skipping this turns the binary from an unlock into a
      # scare, and the npm postinstall currently has to tell mac users to run
      # `xattr -dr com.apple.quarantine` themselves.
      #
      # GATED ON SECRETS BEING PRESENT. A fork or a contributor without the
      # credentials still gets a working unsigned build rather than a red X,
      # and the step says plainly which artifacts are unsigned.
      #
      # Required repository secrets:
      #   APPLE_CERT_P12        base64 of a Developer ID Application .p12
      #   APPLE_CERT_PASSWORD   its export password
      #   APPLE_TEAM_ID         10-character team identifier
      #   APPLE_API_KEY_ID      App Store Connect API key id
      #   APPLE_API_ISSUER_ID   its issuer id
      #   APPLE_API_KEY         base64 of the .p8 private key
      - name: Sign and notarize (macOS)
        if: runner.os == 'macOS'
        env:
          CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          API_KEY: ${{ secrets.APPLE_API_KEY }}
        run: |
          set -euo pipefail
          if [ -z "${CERT_P12:-}" ]; then
            echo "::warning::Apple signing secrets are not configured — "\
                 "${{ matrix.asset }} will be UNSIGNED and Gatekeeper will "\
                 "quarantine it on first run."
            exit 0
          fi

          # Import the certificate into a throwaway keychain rather than the
          # runner's login keychain, so nothing outlives this job.
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PW="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 900 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" \
            -P "$CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -k "$KEYCHAIN_PW" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN"
          rm -f "$RUNNER_TEMP/cert.p12"

          # Sign every Mach-O inside the onedir, not just the launcher: the
          # bundled .so files are loaded at runtime and an unsigned one fails
          # the notarisation check for the whole archive.
          find dist/llm-router -type f \( -name "*.so" -o -name "*.dylib" \) -print0 |
            xargs -0 -I{} codesign --force --timestamp --options runtime \
              --sign "Developer ID Application" {}
          codesign --force --timestamp --options runtime \
            --sign "Developer ID Application" dist/llm-router/llm-router
          codesign --verify --deep --strict --verbose=2 dist/llm-router/llm-router

          # Notarisation takes a zip, and the ticket is stapled to the app
          # afterwards. A onedir has no bundle to staple, so the check that
          # matters is Gatekeeper's assessment of the extracted tree.
          echo "$API_KEY" | base64 --decode > "$RUNNER_TEMP/key.p8"
          ditto -c -k --keepParent dist/llm-router "$RUNNER_TEMP/notarize.zip"
          xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --key "$RUNNER_TEMP/key.p8" \
            --key-id "$API_KEY_ID" \
            --issuer "$API_ISSUER_ID" \
            --team-id "$TEAM_ID" \
            --wait --timeout 30m
          rm -f "$RUNNER_TEMP/key.p8"

          security delete-keychain "$KEYCHAIN"
          echo "signed and notarized: ${{ matrix.asset }}"

      - name: Package
        shell: bash
        run: |
          cd dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "../${{ matrix.asset }}.zip" llm-router
          else
            # ditto preserves the extended attributes and symlinks codesign
            # writes; GNU tar drops some of them and invalidates the signature.
            if [ "${{ runner.os }}" = "macOS" ]; then
              ditto -c -k --keepParent llm-router "../${{ matrix.asset }}.zip"
              tar -czf "../${{ matrix.asset }}.tar.gz" llm-router
            else
              tar -czf "../${{ matrix.asset }}.tar.gz" llm-router
            fi
          fi

      # Run artifacts: for inspecting a workflow_dispatch build. These expire and
      # live at a URL nothing else references.
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.asset }}
          path: |
            ${{ matrix.asset }}.tar.gz
            ${{ matrix.asset }}.zip
          if-no-files-found: error
          retention-days: 14

      # RELEASE assets: what the npm postinstall actually downloads.
      #
      # These are two different destinations and it is easy to ship only the
      # first. upload-artifact attaches to the workflow RUN and expires;
      # npm/install.js fetches
      #   https://github.com/<repo>/releases/download/v<version>/<asset>
      # which requires a release asset. Building perfect binaries into the run
      # and never onto the release means every `npm install` 404s, and the
      # failure lands on a stranger rather than in CI.
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # A TAG IS NOT A RELEASE. `gh release upload` needs a release object,
          # and pushing a tag does not create one — the first real tag build hit
          # exactly this and would have failed at the upload step with every
          # binary already built. Create it if absent, then upload.
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" \
              --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" \
              --generate-notes

          # Upload whatever this platform actually produced.
          #
          # Windows packages a .zip and no .tar.gz; POSIX packages a .tar.gz,
          # and macOS additionally a .zip so codesign metadata survives. The
          # previous version named both files and fell back to `.tar.gz` alone,
          # so on Windows BOTH the primary and the fallback referenced a file
          # that does not exist and the step failed with three platforms already
          # uploaded. Globbing removes the assumption entirely.
          # Test each candidate for existence. `nullglob` was the wrong tool:
          # it only drops patterns containing wildcards, and `<asset>.tar.gz` has
          # none — so a missing file stayed in the array as a literal and the
          # upload failed on it. That broke Linux, which HAD been working.
          artifacts=()
          for f in "${{ matrix.asset }}.tar.gz" "${{ matrix.asset }}.zip"; do
            [ -f "$f" ] && artifacts+=( "$f" )
          done
          if [ ${#artifacts[@]} -eq 0 ]; then
            echo "no packaged artifact found for ${{ matrix.asset }}" >&2
            exit 1
          fi
          echo "uploading: ${artifacts[*]}"
          # --clobber so re-running a tag build replaces rather than fails.
          gh release upload "${GITHUB_REF_NAME}" "${artifacts[@]}" \
            --clobber --repo "${GITHUB_REPOSITORY}"

  # ── macOS Intel, deliberately outside the dependency chain ──────────────
  #
  # GitHub's macos-13 runners were scarce enough to queue for HOURS on every run
  # across a full day and complete on none of them -- and then the label was
  # retired outright: every macos-13 job for a week sat "waiting for a runner"
  # for 24 h and was cancelled. macos-15-intel is GitHub's free Intel label
  # (macos-26-intel is the other; the `-large` ones are paid). It was originally a leg of
  # the `build` matrix, which made it a hard block: `needs: build` waits for
  # every leg to FINISH, and `always()` does not change that — it only decides
  # whether the dependent runs once the wait is over. A permanently queued job
  # therefore blocked the npm publish forever.
  #
  # So it builds on its own. When a runner frees up the asset is attached to the
  # release exactly as before; until then a darwin-x64 user gets install.js's
  # clean "no standalone binary is published for this platform" message and the
  # pip fallback, rather than a broken install.
  #
  # continue-on-error so a failure here is visible without failing the release.
  build-macos-x86:
    name: macos-15-intel (best effort)
    runs-on: macos-15-intel
    continue-on-error: true
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.11"
      - name: Install project and PyInstaller
        run: |
          python -m pip install --upgrade pip
          python -m pip install . pyinstaller
      - name: Build
        run: pyinstaller --noconfirm --clean packaging/llm-router.spec
      - name: Smoke test
        run: |
          BIN=dist/llm-router/llm-router
          "$BIN" --version
          test -f dist/llm-router/_internal/litellm/model_prices_and_context_window_backup.json \
            || { echo "litellm data file missing"; exit 1; }
      - name: Package
        run: |
          cd dist
          ditto -c -k --keepParent llm-router "../llm-router-macos-x86_64.zip"
          tar -czf "../llm-router-macos-x86_64.tar.gz" llm-router
      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release view "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" >/dev/null 2>&1 || \
            gh release create "${GITHUB_REF_NAME}" --repo "${GITHUB_REPOSITORY}" \
              --title "${GITHUB_REF_NAME}" --generate-notes
          artifacts=()
          for f in "llm-router-macos-x86_64.tar.gz" "llm-router-macos-x86_64.zip"; do
            [ -f "$f" ] && artifacts+=( "$f" )
          done
          gh release upload "${GITHUB_REF_NAME}" "${artifacts[@]}" \
            --clobber --repo "${GITHUB_REPOSITORY}"

  # ── npm, gated on the binaries actually existing ────────────────────────
  #
  # This job exists because of what happened on 13.1.4: the package was
  # published by hand before any release asset existed, so every install 404'd
  # on every platform — and npm can never republish a version, only deprecate
  # it. The recovery was to rush the tag through and hope nobody installed in
  # the window.
  #
  # Ordering is the whole point. `needs: build` means npm cannot publish until
  # every binary job has succeeded, so the sequence that has to hold is
  # enforced by the graph rather than by remembering it.
  publish-npm:
    name: Publish to npm
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: npm
    permissions:
      contents: read
      # `npm publish --provenance` mints a signed attestation linking the
      # package to this workflow run, and that needs an OIDC token. Without
      # id-token: write the publish fails at the very last step, after the
      # binaries are already attached — the same shape as the contents: read
      # bug two releases ago.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          # npm 11 (trusted publishing) needs Node 22+; npm 12 needs 22.22+.
          node-version: "22"
          registry-url: "https://registry.npmjs.org"

      # The version in package.json is what install.js turns into a download
      # URL. Publishing a version whose tag has no assets is the exact failure
      # this job exists to prevent, so verify before publishing rather than
      # after.
      - name: Verify every asset the postinstall can request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          version="$(node -p "require('./npm/package.json').version")"
          tag="${GITHUB_REF_NAME}"
          if [ "v$version" != "$tag" ]; then
            echo "npm/package.json is $version but the tag is $tag" >&2
            exit 1
          fi

          published=$(gh release view "$tag" --repo "${GITHUB_REPOSITORY}" \
            --json assets --jq '[.assets[].name]|join(" ")')
          echo "assets on $tag: $published"

          # Every target install.js can select must be downloadable. A platform
          # with no asset is a 404 for that user, and they cannot be told to
          # wait for a later publish of the same version.
          # macOS Intel builds on a best-effort job outside this dependency
          # chain, because its runners queue for hours. Missing it is tolerated
          # and reported: install.js refuses cleanly on a platform with no asset
          # and points at the pip fallback, so a darwin-x64 user gets an honest
          # message rather than a broken install. Every OTHER platform is
          # mandatory — those are the ones this release actually promises.
          missing=0
          for a in $(grep -oE "llm-router-[a-z0-9_-]+\.(tar\.gz|zip)" npm/install.js | sort -u); do
            case " $published " in
              *" $a "*) echo "  ok       $a" ;;
              *)
                case "$a" in
                  *macos-x86_64*)
                    echo "  optional $a (macOS Intel runner did not complete)" ;;
                  *)
                    echo "  MISSING  $a"; missing=1 ;;
                esac ;;
            esac
          done
          [ "$missing" -eq 0 ] || {
            echo "refusing to publish: install.js can request assets that do not exist" >&2
            exit 1
          }

      # Trusted publishing (OIDC) instead of NPM_TOKEN. v13.1.5-v13.1.7 all
      # died with EOTP: the account's 2FA is "authorization and writes" and a
      # classic token cannot bypass it, so `npm publish` asked CI for a
      # six-digit code it can never supply -- AFTER provenance had already
      # been signed into the public transparency log. No pre-flight can catch
      # that: `npm publish --dry-run` never contacts the registry, so it never
      # exercises the OTP check, and `npm whoami` proves reads, not writes.
      #
      # With a trusted publisher npm mints a short-lived credential from the
      # GitHub OIDC token (id-token: write above). No stored secret, no 2FA
      # prompt, provenance attached automatically. One-time setup on npmjs.com:
      #   package llm-routing -> Settings -> Trusted Publisher -> GitHub Actions
      #   owner: ypollak2   repo: llm-router
      #   workflow: binary.yml   environment: npm
      # Needs npm >= 11.5.1; Node 22 bundles npm 10, hence the upgrade.
      # Pinned to the 11 line: `npm@latest` became 12 and refused Node 22
      # with EBADENGINE, which is exactly the "fails at the last step after
      # the binaries are attached" failure this job keeps rediscovering.
      - name: Publish
        working-directory: npm
        run: |
          set -euo pipefail
          npm install -g npm@11
          npm --version

          # A tag build is re-runnable (assets upload with --clobber), but npm
          # can never republish a version. Re-running a tag whose version is
          # already live -- to pick up a late binary, say -- must not fail here.
          version="$(node -p "require('./package.json').version")"
          if npm view "llm-routing@${version}" version >/dev/null 2>&1; then
            echo "::notice::llm-routing@${version} is already on npm -- skipping the publish."
            exit 0
          fi
          npm publish --provenance --access public
