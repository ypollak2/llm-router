name: HOL Skill Validate

on:
  push:
    branches:
      - main
    paths:
      - skills/route/**
      - .github/workflows/hol-skill-validate.yml
  pull_request:
    branches:
      - main
    paths:
      - skills/route/**
      - .github/workflows/hol-skill-validate.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    concurrency:
      group: hol-skill-validate-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The pinned skill-publish action shells out to corepack pnpm, which
      # now resolves to 11.24.0 and requires `node:sqlite` (Node 22+). The
      # runner's default Node 20 makes pnpm crash on module load, before the
      # action reads any of our files. Pin Node 22 so the action can start.
      - name: Use Node 22 (pnpm 11 needs node:sqlite)
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate skill package
        uses: hashgraph-online/skill-publish@df6ae95e010d9792158a441eec9ac50d4d17139d
        with:
          mode: validate
          skill-dir: skills/route
          annotate: "false"
          preview-upload: "false"
