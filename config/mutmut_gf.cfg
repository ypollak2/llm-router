# `bench` and `soak` are COPIED but NOT in source_paths: importable, never
# mutated. Found the hard way, TWICE -- the first baseline run died on
# `No module named 'bench'` and the second on `No module named 'soak'`.
#
# Fixing them one at a time was the checklist error this audit keeps recording.
# The second fix -- enumerate top-level PACKAGES (dirs with __init__.py) -- was
# ALSO wrong: `backfill_sidecars` lives in scripts/, which has no __init__.py and
# is reached by a sys.path insert inside the test. Three failures, two of them
# from fixing the wrong abstraction.
#
# The list is now every ROOT DIRECTORY CONTAINING PYTHON, derived empirically
# rather than reasoned about, and gf_mutmut.py REFUSES TO RUN if one is missing.
# `mutants` and `src` are excluded: mutants/ is mutmut's own output, and src is
# already source_paths.
#
# EVERYTHING FROM `README.md` DOWN IS THE KNOWN BLIND SPOT OF THAT GUARD.
#
# The guard enumerates root directories CONTAINING PYTHON. It therefore cannot see
# `config/` (no .py), `README.md` (not a directory), or `.factory-plugin` (leading
# dot -- explicitly skipped). A full suite run inside the working copy failed 44
# tests on exactly those: README claim checks, plugin/marketplace manifests, deploy
# probes reading Dockerfile and deploy/.
#
# Which is the failure that matters: mutmut marks a mutant KILLED when the suite
# fails, so a test broken by the environment marks every mutant it covers killed and
# INFLATES the score.
#
# THE LIST IS DERIVED FROM AN ACTUAL DIFF (`comm -23` of the two repo roots), not
# predicted. Predicting what the working copy needs failed FIVE times -- bench, soak,
# backfill_sidecars, config, then this -- and twice the fix targeted the wrong
# abstraction entirely. Excluded on purpose: .git, .venv, mutants, dist, .llm_router,
# and the caches, which are large, generated, or irrelevant to any test.
#
# These were fixed by COPYING rather than by widening AMENDMENT 1's exclusion. The
# tests are legitimate; they were failing because the working copy was an incomplete
# repo. Deselecting them would have shrunk the measured suite to make a number
# easier, which is precisely what the amendment must not become.
#
# `.cursor` is DELIBERATELY ABSENT: .cursor/rules/backslash is a dangling symlink into
# another user's home (/Users/yali.pollak/...), and shutil.copytree raises on it, which
# aborted generation entirely. It holds nothing any test reads.
#
# `Docs`, `pyproject.toml` and `setup.cfg` were added after DERIVING what the tests
# actually read: a regex over `ROOT / "..."`-style expressions in tests/, counted and
# checked against also_copy. An earlier `comm -23` of the two repo roots MISSED them,
# because it was taken AFTER a suite run and test-created directories (Docs/ holding
# only a generated SCENARIO_REPORT.md, plus .pytest_cache, .hypothesis) looked exactly
# like copied ones. mutmut's copy_also_copy_files() copies ONLY also_copy plus the
# mutated sources -- nothing is auto-copied, so anything else present in mutants/ is a
# test artefact, not evidence that the file was provided.
#
# The real guard is not this list. It is `scripts/gf_suite_check.py`: run the whole
# suite inside the working copy and require green. An empirical check catches an
# omission of ANY class; a predictive one only catches the class its author imagined.
# `soak` matters doubly -- src/llm_router/commands/soak.py imports soak.report, so
# it is a PRODUCTION dependency, not merely a test one.
#
# Worth noting what mutmut did there: it REFUSED to score rather than reporting
# a number over a suite it could not collect. That is the opposite of the defect
# #26 fixed in the benchmark reporter, which rendered a fully-failed run as a
# complete scorecard.

# DELIBERATELY NO pytest_add_cli_args_test_selection.
#
# The Gate-13 config names an explicit per-module test list. That is an
# optimisation, and for G-F it would be a correctness error: naming the tests
# that "should" own a behaviour is exactly how B8 was misread as absent coverage
# when tests/test_t2_m1_budget_key.py had covered it all along.
#
# G-F asks whether THE SUITE catches a defect, not whether a nominated subset
# does. mutmut 3.x already selects covering tests per mutant, so leaving this
# unset is both more accurate and — measured at ~0.33s/mutant — affordable.
