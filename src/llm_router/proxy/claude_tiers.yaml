# Claude-tier routing for the per-call proxy (llm_router.proxy.tiers).
#
# Opt-in: nothing here is read unless the proxy runs with --tiers on
# (per-turn, PR #215) or --tiers conversation (Phase 1.2b: the tier is chosen
# once, from the conversation's first prompt, and held via stickiness -- see
# proxy/tiers.py's module docstring). Point LLM_ROUTER_PROXY_TIER_POLICY at
# your own copy of this file to change it; model ids live here, never in code.
#
# Why tiers save Max quota (Phase 0.4 probe, 2026-09-29, n=5 calls per model):
# one shared weekly pool drains in proportion to per-call cost, and Opus cost
# 1.68x Sonnet and 6.15x Haiku per call on the same prompt.

# Ranked cheapest -> most capable. `model` is the id a rewrite sends;
# `also` lists other ids that count as this tier when a request names them.
# `thinking` lists the request `thinking.type` values this tier accepts, and
# `effort: false` marks a tier that rejects `output_config.effort`: a request is
# never moved to a tier that would refuse it. Haiku 4.5 takes only
# budget_tokens thinking and errors on effort, while Sonnet 5, Opus 5.5 and
# Fable 5.1 reject budget_tokens (Anthropic API docs, checked 2026-09-29); Claude Code sends adaptive thinking plus effort on main-loop
# calls, so by default those stay on Sonnet or above. `haiku_rewrite` below
# is the opt-in way to serve a narrow class of them on Haiku.
tiers:
  - name: haiku
    model: claude-haiku-4-5
    thinking: [enabled]
    effort: false
    # To serve Claude Haiku 5.5 instead (proxy/translate.py and proxy/tiers.py key every
    # Haiku rule off this `model`; docs/bugs/HAIKU55-TIER-1.md has the sources), replace the
    # three lines above with:
    #   model: claude-haiku-5-5
    #   thinking: [adaptive]      # 5.5 takes adaptive thinking, rejects budget_tokens `enabled`
    #                             # (and `disabled` with effort xhigh/max, so it is not listed)
    #   (no `effort: false`)      # 5.5 takes all five effort levels
    # On 5.5 haiku_fold_system is ignored (it takes the system role as sent) and the Haiku
    # context limit is 75K estimated tokens, not 150K: Haiku 5.5 costs 5x per token above
    # 100K prompt tokens ($0.10/$0.50 -> $0.50/$2.50 per MTok). Claude Haiku 4.5 retires
    # not sooner than 2026-10-15 (platform.claude.com/docs/en/models/haiku-4-5/overview).
  - name: sonnet
    model: claude-sonnet-5-5
    also: [claude-sonnet-5]
    thinking: [adaptive]
  - name: opus
    model: claude-opus-5-5
    thinking: [adaptive]
  - name: fable
    model: claude-fable-5-1
    thinking: [adaptive]

# (task_type, complexity) -> tier. `default` applies to every task type; a
# task-type key (e.g. `code:`) overrides individual complexities for that type.
# Complexity comes from the router's own classifier (classify_signals with
# GATEWAY_POLICY) over the conversation's newest human prompt.
route:
  default:
    simple: haiku
    moderate: sonnet
    complex: opus
    deep_reasoning: opus

# false: a request is only ever moved DOWN from the tier it asked for, never up.
allow_upgrade: false

# true: after the classifier, the learned complexity score (complexity_knn,
# Phase 2.1) moves the complexity across the frontier boundary: P(needs
# frontier) >= threshold lifts it to at least `complex`, below the threshold
# lowers `complex`/`deep_reasoning` to `moderate`. Needs an artifact built by
# scripts/build_complexity_knn.py; without one it abstains. Off: it has not
# been measured on real Claude Code prompts (0 labelled owner turns).
complexity_knn: false

# true: a turn the classifier routes to `haiku` (simple/mechanical) is served
# ON Haiku instead of being raised to Sonnet by the thinking floor. The body is
# rewritten for Haiku 4.5 (translate.for_haiku): `thinking` (adaptive 400s on
# Haiku), `output_config` (effort is unsupported) and the clear_thinking_*
# context edits are dropped, `max_tokens` is clamped to Haiku's 64K. Only when
# the conversation has no images/documents, uses only client-defined tools,
# carries no mid-conversation `role: "system"` message (Haiku 400s on that
# role outright -- a live smoke call got "role 'system' is not supported on
# this model"; Claude Code 2.1.285's own per-turn-control/mid-conversation-
# system beta features send one on every call today, so this gate is
# currently the live-traffic bottleneck, not the others) and stays under
# ~150K tokens (Haiku's window is 200K). Escalation (`opus:`, correction
# signals, failed tool runs) and conversation stickiness still apply, and a
# 4xx from a rewritten call is retried once with the client's original
# bytes. Off: Haiku was acceptable on 5/15 pilot Q&A prompts
# against 15/15 for Sonnet and Opus, so it stays opt-in until the paired A/B
# in the PR that added it has been run.
haiku_rewrite: false

# true: a body that carries mid-conversation `role: "system"` messages (the
# blocker described above) is eligible for the Haiku rewrite too. The rewrite moves
# each such message into a `<system-reminder>` text block of a user message
# (translate.fold_system_messages): at the start of the next user message (after its
# tool_result blocks), else appended to the previous one; the message's effort
# control is dropped. The top-level `system` field is untouched, so the cache prefix
# is kept. Only takes effect together with `haiku_rewrite: true`. Off: it is only
# for the smoke proxy until the M2 canary decides (PLAN M0.7).
haiku_fold_system: false

# Requested model ids that are never rewritten (e.g. the model you pass with
# `claude --model`, which the proxy cannot tell apart from the default).
pinned_models: []

# D-31 experiment arm (default OFF: absent or 0). A fraction 0-1 of *simple Q&A* turns
# (classifier says query/simple; main-thread human turn, past the first call, no opus:/
# /model pin, no correction signal, a body Haiku accepts) is served on Haiku EVEN IF the
# requested model is in pinned_models. Assignment is a hash of session_id + turn, not a
# draw. Each in-share turn is logged with tier_arm / tier_arm_assignment / tier_arm_reason
# (see proxy/haiku_arm.py). Needs haiku_rewrite: true (the Haiku guard's override turns
# the arm off too). Read at proxy start: set 0 or delete the key and restart to kill it.
# haiku_arm_share: 0.10
# haiku_arm_eligible: [query/simple]   # optional task/complexity patterns (complexity may be *); default exactly this

# Quota-aware tiers: the higher of the Claude subscription's session and weekly
# usage, read from the cached ~/.llm-router/usage.json (never a network call on
# the proxy path), steps calls down as the quota fills, because Max quota
# drains in proportion to per-call cost (Opus 1.68x Sonnet, 6.15x Haiku).
#   below cap_at          no change
#   cap_at and above      nothing above Sonnet: Opus/Fable -> Sonnet, a tier
#                         stickiness would hold included
#   moderate_at and above also `moderate` turns -> Haiku where Haiku takes the
#                         body (thinking floor still applies, so with Claude
#                         Code's adaptive thinking that is Sonnet unless
#                         haiku_rewrite makes the turn eligible)
#   98%+                  nothing more: the proxy can only forward to Claude
# Exempt: `opus:` pins, /model pins, pinned_models, and correction escalation
# (still Opus, logged as escalation_under_pressure). A reading older than
# max_age_s, a missing file or the refresh-failed fallback changes nothing.
# Kill switch: LLM_ROUTER_PROXY_QUOTA_PRESSURE=off. Thresholds are fractions.
quota_pressure:
  enabled: true
  cap_at: 0.70
  moderate_at: 0.90
  max_age_s: 1800

stickiness:
  # Seconds without a call after which a conversation's prompt cache is
  # treated as cold, so a tier switch costs nothing extra. Claude Code writes
  # its cache with the 1-hour TTL.
  cold_gap_s: 3600
  # Move to the policy tier on the call right after the conversation's first
  # call (plan on the requested model, execute on the cheaper one). Off: it
  # measured net negative on short tasks, because the switch re-writes the
  # whole prompt cache on the new tier (see proxy/cache_cost.py).
  switch_after_first_call: false
